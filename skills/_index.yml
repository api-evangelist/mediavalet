shared_rules:
- Send BOTH credentials on every request — Authorization bearer token AND Ocp-Apim-Subscription-Key.
- >-
  ALWAYS set x-mv-api-version explicitly. Omitting it pins the caller to version 1.0, which 400s on
  anything added in 1.1 or later.
- >-
  Read Meta.Errors and Meta.Warnings on EVERY response, including 200s. Malformed PATCH instructions
  and unrecognized query parameters are silently ignored and reported there.
- 202 Accepted means accepted, not complete. Uploads, check-in/out and video processing are asynchronous.
- 204 is not always success — MediaValet also uses it for "not found" on some paths.
- >-
  There is no idempotency key. Read before write, and verify with a GET before retrying any non-GET
  that failed ambiguously.
- On API version 1.2 a permission failure is 403, not 401. Do not respond to it with a token refresh.
- >-
  Check permissions[] and _links.functions[] on a resource before attempting a write — MediaValet
  publishes per-user affordances, so a 403 is usually predictable.
