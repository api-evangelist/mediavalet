notes:
- scopes_supported is read verbatim from the live OpenID Connect discovery document, not inferred.
- MediaValet's own documented authorization request uses scope=openid api; the password-grant example
  uses scope=api.
- 'The API itself is not scope-partitioned per resource: a single "api" scope grants access to the REST
  surface, and per-object authorization is enforced by MediaValet permission rules (see openapi/mediavalet-authorization-api-openapi.yml
  and the Permissions array returned on resources), not by OAuth scopes.'
- IdentityServerApi is an IdentityServer administrative scope exposed by the identity product; it is not
  part of the public MediaValet API surface.
