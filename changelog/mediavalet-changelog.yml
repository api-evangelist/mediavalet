description: >-
  MediaValet publishes a dated API changelog inside its API documentation, keyed to the REST API
  version selected by the x-mv-api-version header. Entries are grouped Keep-a-Changelog style
  (Changed / Added / Deprecated). There is no separate changelog host, no RSS/Atom feed, and no
  per-release page URL — the changelog is a section of the documentation, so it cannot be watched
  programmatically.
