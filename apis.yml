aid: mediavalet
url: https://raw.githubusercontent.com/api-evangelist/mediavalet/refs/heads/main/apis.yml
name: MediaValet
kind: company
description: MediaValet is a cloud-native, Microsoft Azure-based digital asset management (DAM) platform
  for storing, organizing, governing, sharing and distributing an organization's images, videos, documents
  and other brand, campaign and product assets. Its Open API is a RESTful, JSON, hypermedia-driven service
  at https://api.mediavalet.com, fronted by Azure API Management and secured with BOTH an OAuth 2.0
  / OpenID Connect bearer token (issuer https://iam.mediavalet.com) and a per-account Ocp-Apim-Subscription-Key.
  The published surface runs to 312 operations across 29 resources - assets, categories, attributes,
  keywords, uploads, users, user groups, branded portals, lightboxes, direct/CDN links, downloads, sharing,
  crops, persons, saved searches, reports, notifications, organizational units and third-party integrations
  - plus SkyHOOK, an event service that delivers CloudEvents 1.0 messages to a webhook or a private
  Azure Event Grid instance. API versions are selected per request with the x-mv-api-version header
  (1.0 default, 1.1, 1.2). MediaValet publishes no OpenAPI; its machine-readable contract is a Postman
  Collection v2.1.0 at docs.mediavalet.com, from which the definitions in this repo are derived. Access
  requires an existing MediaValet subscription and an approved Developer Portal account.
