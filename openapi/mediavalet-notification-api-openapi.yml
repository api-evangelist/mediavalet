        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                notificationEntityType:
                  type: string
                userGroups:
                  type: array
                  items:
                    type: string
                    format: uuid
                users:
                  type: array
                  items:
                    type: string
                    format: uuid
                userEmails:
                  type: array
                  items:
                    type: string
                message:
                  type: string
            example:
              entityIds:
              - <uuid>
              - <uuid>
              notificationEntityType: SavedSearches
              userGroups:
              - <uuid>
              - <uuid>
              users:
              - <uuid>
              - <uuid>
              userEmails:
              - <string>
              - <string>
              message: <string>
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
