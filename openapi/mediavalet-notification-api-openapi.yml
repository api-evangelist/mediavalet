openapi: 3.2.0
info:
  title: MediaValet Notification API
  description: The MediaValet API is a RESTful, JSON, hypermedia-driven service that supplies data to clients consuming the MediaValet cloud digital asset management (DAM) platform.
  version: '1.0'
  contact:
    name: MediaValet
    url: https://developer.mediavalet.com
  termsOfService: https://www.mediavalet.com/terms-of-service
servers:
- url: https://api.mediavalet.com
  description: MediaValet API gateway (public)
security:
- oauth2:
  - api
  subscriptionKey: []
tags:
- name: Notification
  description: In-product notifications and notification preferences.
paths:
  /notification/assets/{assetId}/followers:
    get:
      operationId: notificationGetAssetFollowers
      summary: Notification Get Asset Followers
      tags:
      - Notification
      parameters:
      - name: assetId
        in: path
        required: true
        description: assetId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                      format: uuid
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                    isCurrentUser:
                      type: boolean
              example:
              - userId: <uuid>
                firstName: <string>
                lastName: <string>
                email: <string>
                isCurrentUser: <boolean>
              - userId: <uuid>
                firstName: <string>
                lastName: <string>
                email: <string>
                isCurrentUser: <boolean>
        '401':
          description: The current user is not authorized to view this end-point.
        '403':
          description: The user does not have permission to perform this operation.
        '500':
          description: The request failed because of a problem on the server.
  /notification/inApp:
    get:
      operationId: notificationGetInAppNotifications
      summary: Notification Get In App Notifications
      tags:
      - Notification
      parameters:
      - name: bypassCache
        in: query
        required: false
        description: bypassCache query parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notificationId:
                      type: string
                      format: uuid
                    displayNotificationId:
                      type: string
                    sender:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: string
                    notificationCategory:
                      type: string
                    relativeUrl:
                      type: string
                    message:
                      type: string
                    markedAsRead:
                      type: boolean
                    timestamp:
                      type: string
                    entityIds:
                      type: array
                      items:
                        type: string
                        format: uuid
              example:
              - notificationId: <uuid>
                displayNotificationId: <string>
                sender:
                  id: <uuid>
                  firstName: <string>
                  lastName: <string>
                  email: <string>
                notificationCategory: <string>
                relativeUrl: <string>
                message: <string>
                markedAsRead: <boolean>
                timestamp: <string>
                entityIds:
                - <uuid>
                - <uuid>
              - notificationId: <uuid>
                displayNotificationId: <string>
                sender:
                  id: <uuid>
                  firstName: <string>
                  lastName: <string>
                  email: <string>
                notificationCategory: <string>
                relativeUrl: <string>
                message: <string>
                markedAsRead: <boolean>
                timestamp: <string>
                entityIds:
                - <uuid>
                - <uuid>
        '401':
          description: The current user is not authorized to view this end-point.
        '403':
          description: The user does not have permission to perform this operation.
        '500':
          description: The request failed because of a problem on the server.
  /notification/markAllAsRead:
