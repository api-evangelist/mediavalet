                    properties:
                      velitb:
                        type: object
                      Lorem_e93:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                validEmails:
                - <string>
                - <string>
                invalidEmails:
                - <string>
                - <string>
                _links:
                  self: <string>
                  functions:
