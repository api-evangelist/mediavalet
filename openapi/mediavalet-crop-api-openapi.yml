        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                renditionType:
                  type: string
                left:
                  type: integer
                top:
                  type: integer
                width:
                  type: integer
                height:
                  type: integer
                ratio:
                  type: string
                applyWatermark:
                  type: boolean
            example:
              renditionType: Original
              left: <integer>
              top: <integer>
              width: <integer>
              height: <integer>
              ratio: <string>
              applyWatermark: <boolean>
