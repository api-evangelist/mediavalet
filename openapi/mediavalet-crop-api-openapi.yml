    get:
      operationId: retrieveCrop
      summary: Retrieve Crop
      description: Retrieve the crop image url.
      tags:
      - Crop
      parameters:
      - name: cropId
        in: path
        required: true
        description: cropId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  croppedImageUrl:
                    type: string
                  CropId:
                    type: string
                    format: uuid
                  AssetId:
                    type: string
                    format: uuid
                  CreatedDateTime:
                    type: string
                    format: date-time
                  Height:
                    type: integer
                  Width:
                    type: integer
                  TemplateName:
                    type: string
                  Ratio:
                    type: string
                  TemplateId:
                    type: string
                    format: uuid
              example:
                croppedImageUrl: <string>
                CropId: <uuid>
                AssetId: <uuid>
                CreatedDateTime: <dateTime>
                Height: <integer>
                Width: <integer>
                TemplateName: <string>
                Ratio: <string>
                TemplateId: <uuid>
        '401':
          description: The current user is not authorized to view this end-point.
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: The crop was not found.
        '500':
          description: The request failed because of a problem on the server.
