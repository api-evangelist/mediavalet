      responses:
        '200':
          description: The Attribute Groups were successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    attributeGroupId:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    attributeIds:
                      type: array
                      items:
                        type: string
                    _links:
                      type: object
                      properties:
                        self:
                          type: string
                        functions:
                          type: array
                          items:
                            type: string
                    translationKeys:
                      type: object
                      properties:
                        key_0:
                          type: object
                        key_1:
                          type: object
                    interpolations:
                      type: object
                      properties:
                        key_0:
                          type: object
                    permissions:
                      type: array
                      items:
                        type: string
              example:
              - attributeGroupId: 00000000-0000-0000-0000-000000000000
                name: string
                description: string
                attributeIds:
                - 00000000-0000-0000-0000-000000000000
                - 00000000-0000-0000-0000-000000000000
                _links:
                  self: string
                  functions:
                  - string
                  - string
                translationKeys:
                  key_0: {}
                  key_1: {}
                interpolations:
                  key_0: {}
                permissions:
                - asset:shareAsLink
                - lightbox:assignAsset
              - attributeGroupId: 00000000-0000-0000-0000-000000000000
                name: string
                description: string
                attributeIds:
                - 00000000-0000-0000-0000-000000000000
                - 00000000-0000-0000-0000-000000000000
                _links:
                  self: string
                  functions:
                  - string
                  - string
                translationKeys:
                  key_0: {}
                  key_1: {}
                interpolations:
                  key_0: {}
                permissions:
                - attributeGroup:view
                - asset:shareAsLink
        '403':
          description: Attribute grouping is not enabled for this library or you do not have permission to view attribute groups.
        '500':
          description: The request failed because of a problem on the server.
