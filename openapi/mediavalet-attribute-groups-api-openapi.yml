      summary: Creates a new Attribute Group
      tags:
      - Attribute Groups
      parameters:
      - name: x-mv-api-version
        in: header
        required: false
        description: The requested API version
        schema:
          type: string
        example: '1.0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                attributeIds:
                  type: array
                  items:
                    type: string
            example:
              name: string
              description: string
              attributeIds:
              - 00000000-0000-0000-0000-000000000000
              - 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example: {}
        '201':
          description: The Attribute Group was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attributeGroupId:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  attributeIds:
                    type: array
                    items:
                      type: string
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      key_0:
                        type: object
                      key_1:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      key_0:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                attributeGroupId: 00000000-0000-0000-0000-000000000000
                name: string
                description: string
                attributeIds:
                - 00000000-0000-0000-0000-000000000000
                - 00000000-0000-0000-0000-000000000000
                _links:
                  self: string
                  functions:
                  - string
                  - string
                translationKeys:
                  key_0: {}
                  key_1: {}
                interpolations:
                  key_0: {}
                permissions:
                - asset:shareAsWebGallery
                - attributeGroup:viewAttribute
        '400':
          description: Bad Request.
        '403':
          description: Attribute grouping is not enabled for this library or you do not have permission to create attribute groups.
        '404':
          description: Attribute not found
        '500':
          description: The request failed because of a problem on the server.
