openapi: 3.2.0
info:
  title: MediaValet Saved Searches API
  description: The MediaValet API is a RESTful, JSON, hypermedia-driven service that supplies data to clients consuming the MediaValet cloud digital asset management (DAM) platform.
  version: '1.0'
  contact:
    name: MediaValet
    url: https://developer.mediavalet.com
  termsOfService: https://www.mediavalet.com/terms-of-service
servers:
- url: https://api.mediavalet.com
  description: MediaValet API gateway (public)
security:
- oauth2:
  - api
  subscriptionKey: []
tags:
- name: Saved Searches
  description: Saved searches and their execution.
paths:
  /savedsearches:
    get:
      operationId: retrieveSavedSearches
      summary: Retrieve Saved Searches
      description: Retrieves all custom saved searches.
      tags:
      - Saved Searches
      parameters:
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  searchQuery:
                    type: string
                  ownerUserId:
                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
    post:
      operationId: createSavedSearch
      summary: Create Saved Search
      description: Creates a new custom search.
      tags:
      - Saved Searches
      parameters:
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                searchQuery:
                  type: string
            example:
              id: <uuid>
              name: <string>
              searchQuery: <string>
      responses:
        '201':
          description: The saved search was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  searchQuery:
                    type: string
                  ownerUserId:
                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '400':
          description: There was a problem with the data sent with the request.
        '403':
          description: The user does not have permission to perform this operation.
        '500':
          description: The request failed because of a problem on the server.
  /savedsearches/pinned:
    get:
      operationId: retrievePinnedSavedSearches
      summary: Retrieve Pinned Saved Searches
      description: Retrieves all pinned saved searches.
      tags:
      - Saved Searches
      parameters:
      - name: x-mv-api-version
