openapi: 3.0.3
info:
  title: MediaValet SavedSearches API
  description: |-
    The MediaValet API is a RESTful, JSON, hypermedia-driven service that supplies data to clients consuming the MediaValet cloud digital asset management (DAM) platform. The service applies business rules, permission rules, and other data processing to standardize what is returned. Requests go to the API gateway at https://api.mediavalet.com and must carry two credentials: an OAuth 2.0 / OpenID Connect Bearer access token issued by https://login.mediavalet.com/connect/token, and a per-account subscription key in the Ocp-Apim-Subscription-Key header. Requests also carry an x-mv-api-version header to select the API version. Access requires a MediaValet subscription and registration in the MediaValet Developer Portal at https://developer.mediavalet.com.

    PROVENANCE: this definition is derived operation-for-operation from MediaValet's own published Postman collection ("MediaValet API", collection 55cc404f-b818-43ba-87c2-1a07f2a47bd9) served at https://docs.mediavalet.com/api/collections/15676803/TzRUB7XE. Paths, methods, parameters, request bodies, response status codes and examples come from that collection. Schemas are inferred from the collection's request/response example payloads and are indicative rather than authoritative.
  version: '1.0'
  contact:
    name: MediaValet
    url: https://developer.mediavalet.com
  termsOfService: https://www.mediavalet.com/terms-of-service
servers:
- url: https://api.mediavalet.com
  description: MediaValet API gateway (public)
security:
- oauth2:
  - api
  subscriptionKey: []
tags:
- name: SavedSearches
  description: Saved searches and their execution.
paths:
  /savedsearches:
    get:
      operationId: retrieveSavedSearches
      summary: Retrieve Saved Searches
      description: Retrieves all custom saved searches.
      tags:
      - SavedSearches
      parameters:
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  searchQuery:
                    type: string
                  ownerUserId:
                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
    post:
      operationId: createSavedSearch
      summary: Create Saved Search
      description: Creates a new custom search.
      tags:
      - SavedSearches
      parameters:
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                searchQuery:
                  type: string
            example:
              id: <uuid>
              name: <string>
              searchQuery: <string>
      responses:
        '201':
          description: The saved search was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  searchQuery:
                    type: string
                  ownerUserId:
                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '400':
          description: There was a problem with the data sent with the request.
        '403':
          description: The user does not have permission to perform this operation.
        '500':
          description: The request failed because of a problem on the server.
