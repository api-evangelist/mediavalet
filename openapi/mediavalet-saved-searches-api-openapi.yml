                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A pinned saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
  /savedsearches/{savedSearchId}:
    get:
      operationId: retrieveSavedSearch
      summary: Retrieve Saved Search
      description: Retrieves a custom saved search.
      tags:
      - Saved Searches
      parameters:
      - name: savedSearchId
        in: path
        required: true
        description: savedSearchId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  searchQuery:
                    type: string
                  ownerUserId:
                    type: string
                  ownerUserName:
                    type: string
                  sharedWithOthers:
                    type: boolean
                  pinnedSearchForUser:
                    type: boolean
                  pinnedSearchForGroups:
                    type: boolean
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      functions:
                        type: array
                        items:
                          type: string
                  translationKeys:
                    type: object
                    properties:
                      eu_4:
                        type: object
                  interpolations:
                    type: object
                    properties:
                      ex_1:
                        type: object
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                id: <uuid>
                name: <string>
                searchQuery: <string>
                ownerUserId: <string>
                ownerUserName: <string>
                sharedWithOthers: <boolean>
                pinnedSearchForUser: <boolean>
                pinnedSearchForGroups: <boolean>
                _links:
                  self: <string>
                  functions:
                  - <string>
                  - <string>
                translationKeys:
                  eu_4: {}
                interpolations:
                  ex_1: {}
                permissions:
                - lightbox:assignAsset
                - None
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
    delete:
      operationId: removeSavedSearch
      summary: Remove Saved Search
      description: Removes a custom saved search.
      tags:
      - Saved Searches
      parameters:
      - name: savedSearchId
        in: path
        required: true
        description: savedSearchId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
    patch:
      operationId: updateSavedSearch
      summary: Update Saved Search
      description: Update a custom saved search with a list of patch operations.
      tags:
      - Saved Searches
      parameters:
      - name: savedSearchId
        in: path
        required: true
        description: savedSearchId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                  path:
                    type: string
                  value:
                    type: object
                  from:
                    type: string
            example:
            - op: <string>
              path: <string>
              value: {}
              from: <string>
            - op: <string>
              path: <string>
              value: {}
              from: <string>
      responses:
        '200':
          description: Request was successful.
        '400':
          description: There was a problem with the data sent with the request.
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
  /savedsearches/{savedSearchId}/share:
    get:
      operationId: retrieveSavedSearchShares
      summary: Retrieve Saved Search Shares
      description: Retrieves shares for a saved search.
      tags:
      - Saved Searches
      parameters:
      - name: savedSearchId
        in: path
        required: true
        description: savedSearchId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharedWithUsers:
                    type: array
                    items:
                      type: string
                      format: uuid
                  sharedWithGroups:
                    type: array
                    items:
                      type: string
                      format: uuid
                  pinnedForGroups:
                    type: array
                    items:
                      type: string
                      format: uuid
              example:
                sharedWithUsers:
                - <uuid>
                - <uuid>
                sharedWithGroups:
                - <uuid>
                - <uuid>
                pinnedForGroups:
                - <uuid>
                - <uuid>
        '400':
          description: There was a problem with the data sent with the request.
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
    post:
      operationId: createSavedSearch2
      summary: Create Saved Search
      description: Creates a custom saved search.
      tags:
      - Saved Searches
      parameters:
      - name: savedSearchId
        in: path
        required: true
        description: savedSearchId path parameter.
        schema:
          type: string
      - name: x-mv-api-version
        in: header
        required: false
        description: (Required) The requested API version
        schema:
          type: string
        example: '1.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                savedSearchId:
                  type: string
                  format: uuid
                shareWithUsers:
                  type: array
                  items:
                    type: string
                    format: uuid
                shareWithGroups:
                  type: array
                  items:
                    type: string
                    format: uuid
            example:
              savedSearchId: <uuid>
              shareWithUsers:
              - <uuid>
              - <uuid>
              shareWithGroups:
              - <uuid>
              - <uuid>
      responses:
        '200':
          description: Request was successful.
        '400':
          description: There was a problem with the data sent with the request.
        '403':
          description: The user does not have permission to perform this operation.
        '404':
          description: A saved search was not found.
        '500':
          description: The request failed because of a problem on the server.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 / OpenID Connect issued by https://iam.mediavalet.com via https://login.mediavalet.com. Send the access token as a Bearer Authorization header.
      flows:
        authorizationCode:
          authorizationUrl: https://login.mediavalet.com/connect/authorize
          tokenUrl: https://login.mediavalet.com/connect/token
          refreshUrl: https://login.mediavalet.com/connect/token
          scopes:
            openid: OpenID Connect identity
            profile: User profile claims
            api: Access the MediaValet API
            api:service_principal: Service-principal (machine) access to the MediaValet API
            iam.admin: Administer MediaValet identity and access management
            iam.provisioning: Provision users and organizations
            offline_access: Obtain a refresh token
        clientCredentials:
          tokenUrl: https://login.mediavalet.com/connect/token
          scopes:
            api: Access the MediaValet API
            api:service_principal: Service-principal (machine) access to the MediaValet API
        password:
          tokenUrl: https://login.mediavalet.com/connect/token
          scopes:
            openid: OpenID Connect identity
            api: Access the MediaValet API
            offline_access: Obtain a refresh token
    subscriptionKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: Per-account API subscription key issued through the MediaValet Developer Portal (Azure API Management).
