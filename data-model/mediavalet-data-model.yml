  description: >-
    A digital asset. Carries a media block (thumbnail/small/medium/large/original/download/stream
    URLs, dimensions, SAS expiry), a file block (filename, md5, mime type, size, image dimensions,
    frame rate, bitrate, colour mode, orientation), a record block (created/modified/soft-deleted
    audit plus a version sub-object), status, rating, alt text, and denormalised attribute, keyword
    and category collections.
  notable_fields:
