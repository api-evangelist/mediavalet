description: >-
  The MediaValet entity graph. The Asset is the centre of the model — 60 of 245 paths are keyed by
  assetId — and everything else is either a container for assets (Category, Lightbox, Branded
  Portal), a descriptor attached to assets (Attribute, Keyword, Person), a distribution surface for
  assets (Direct Link, Download, Share, Crop), or the tenancy and identity around them
  (Organizational Unit / library, User, User Group). All ids are GUIDs. Resources are
  hypermedia-decorated: each carries a `_links` object (`self` plus a `functions` array) and a
  `permissions` array scoped to the calling user.
id_format: uuid
tenancy_root: OrganizationalUnit (library)
