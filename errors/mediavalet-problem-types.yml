  Requests" and "Changelogs" sections of that same collection.
docs: https://docs.mediavalet.com/
format: custom-envelope
rfc9457: false
description: >-
  MediaValet does NOT use RFC 9457 (application/problem+json). Errors ride inside the same universal
  response envelope every MediaValet response uses, in Meta.Errors (with non-fatal problems in
  Meta.Warnings), alongside the HTTP status code. There is no published registry of machine-readable
  error codes or error type URIs — the discriminator available to a client is the HTTP status plus
  the human-readable text in Meta.Errors. Most 4xx/5xx responses in the documented surface return a
  text/plain body rather than JSON.
envelope:
  media_type: application/json
  error_field: Meta.Errors
  warning_field: Meta.Warnings
  timestamp_field: Meta.CreatedOn
  version_field: ApiVersion
  shape:
    ApiVersion: '1.2'
    Meta:
      MetaInformation: {}
      Warnings: []
      Errors: []
      CreatedOn: '2024-02-01T00:00:00Z'
    RecordCount:
      TotalRecordsFound: 0
      StartingRecord: 1
      RecordsReturned: 10
    Payload: {}
  note: >-
    A 200 is not proof of success. Ignored PATCH instructions and unrecognized include/exclude
    fields are reported in Meta.Errors and Meta.Warnings on an otherwise-successful response, so an
    agent MUST inspect Meta after every write.
