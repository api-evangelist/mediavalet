  - '"We build your pricing around how your team actually works so you''re not paying for limitations, workarounds, or future upgrades."'
  advertised_inclusions:
  - Unlimited users and permission groups
  - No forced tiers
  - Unlimited category creation
  - Structured onboarding
  - Hands-on expert support
access_requirements:
- Must be an existing MediaValet customer or partner with access to a MediaValet library.
- Register at https://developer.mediavalet.com/signup; MediaValet support verifies and activates the account.
- MediaValet issues client_id and client_secret; subscription keys appear under the Developer Portal profile once approved.
- Administrator permissions in the MediaValet account are required to use the API.
