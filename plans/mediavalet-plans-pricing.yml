plans:
- name: Developer Plan
  url: https://developer.mediavalet.com/plans
  price: null
  currency: null
  billing_period: null
  price_note: Not published. Included with a MediaValet subscription; assigned by default on account approval.
  default: true
  audience: >-
    "Are you a developer looking to explore the potential of a custom integration or workflow? Our
    Developer Plan is designed for you."
  included:
  - Proof-of-concept development against the MediaValet API.
  - Testing potential integrations for compatibility, performance and functionality.
  quota:
    daily_requests: null
    description: >-
      "The Developer Plan comes with a limited amount of daily requests to get you started. This
      limit provides enough room to experiment, fine-tune your integration and evaluate the
      scalability of your solution." The numeric cap is not published.
  overage: null
  limits:
  - Daily request limit (value unpublished).
  - Webhooks (SkyHOOK) not included — Enterprise only.
- name: Enterprise Plan
  url: https://developer.mediavalet.com/plans
  price: null
  currency: null
  billing_period: null
  price_note: Not published. Requested by upgrading from the Developer Plan when call volume is too high.
  default: false
  audience: '"Ready to expand your custom integration or workflow? Our Enterprise plan is ready when you are."'
  included:
  - Full suite of MediaValet API endpoints.
  - MediaValet secure Webhooks (SkyHOOK event subscriptions).
  - '"Access a Dedicated Testing Library" — an isolated sandbox environment separate from production.'
  - Dedicated support and collaboration from the MediaValet expert team, from setup through optimization.
  quota:
    daily_requests: null
    description: '"a generous limit of API calls... the freedom to make a near unlimited number of requests and calls"'
  overage: null
  limits:
  - No published numeric ceiling; described only as "near unlimited".
