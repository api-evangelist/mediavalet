description: >-
  MediaValet publishes TWO named API subscription plans in its Developer Portal — Developer and
  Enterprise — but no price for either, and no price for the underlying DAM platform. The platform
  itself is sold on a custom-quote basis: the pricing page says "Most DAM pricing forces you into
  rigid tiers, per-user fees, or bloated packages. MediaValet doesn't. We build your pricing around
  how your team actually works," and the only call to action is "Get Your Custom DAM Pricing."
  API access is an entitlement of a MediaValet platform subscription rather than a separately priced
  product: you must already have access to a MediaValet library to get a developer account at all.
